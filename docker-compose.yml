services:
  db:
    image: postgres:16-alpine
    container_name: gestion-inf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestion_informatica
    ports:
      - '5433:5432'
    volumes:
      - gestion_inf_pgdata:/var/lib/postgresql/data

volumes:
  gestion_inf_pgdata:
